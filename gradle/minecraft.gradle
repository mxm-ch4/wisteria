// Shared build logic of every compat/v26_x project. The project itself applies Loom and sets, in its
// gradle.properties: minecraft_version, minecraft_dependency, fabric_api_version, compat_package.

evaluationDependsOn(':core')

def core = project(':core')
def common = rootProject.file('compat/common')

base {
	archivesName = 'wisteria'
}
version = "${rootProject.version}+${project.minecraft_version}"

sourceSets {
	main {
		java.srcDir new File(common, 'src/main/java')
		resources.srcDir new File(common, 'src/main/resources')
	}
}

// The version gate (SPEC_AMENDMENT_2 §1): a dev-only mod with a client game test, never part of the release jar.
fabricApi {
	configureTests {
		createSourceSet = true
		modId = 'wisteria-gate'
		enableGameTests = false
		enableClientGameTests = true
		eula = true
		// The gate launches the game twice over the same directory to prove settings survive a restart;
		// tools/gate.sh wipes the directory itself before the first launch.
		clearRunDirectory = false
	}
}

sourceSets {
	gametest {
		java.srcDir new File(common, 'src/gametest/java')
		resources.srcDir new File(common, 'src/gametest/resources')
	}
}

loom {
	mods {
		"wisteria" {
			sourceSet sourceSets.main
			sourceSet core.sourceSets.main
		}
	}

	// -Pbackend=VULKAN (or OPENGL) forces the graphics backend for a run.
	runs.configureEach {
		if (project.hasProperty('backend')) {
			programArgs '--graphicsBackend', project.property('backend').toString()
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${rootProject.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	implementation core
	gametestImplementation core
}

def expansions = [
	version             : project.version.toString(),
	minecraft_dependency: project.minecraft_dependency.toString(),
	compat_package      : project.compat_package.toString(),
	loader_version      : rootProject.loader_version.toString()
]

processResources {
	inputs.properties expansions
	filesMatching(['fabric.mod.json', '*.mixins.json']) {
		expand expansions
	}
}

processGametestResources {
	inputs.properties expansions
	filesMatching(['fabric.mod.json', '*.mixins.json']) {
		expand expansions
	}
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

// core is not a separate mod: its classes go straight into the version jar.
jar {
	from core.sourceSets.main.output
	from(rootProject.file('LICENSE')) {
		rename { "${it}_wisteria" }
	}
}

sourcesJar {
	from core.sourceSets.main.allSource
}
