plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base {
	archivesName = 'wisteria'
}

loom {
	mods {
		"wisteria" {
			sourceSet sourceSets.main
		}
	}
}

// Stage 0 probe + client game tests: src/gametest, its own mod ("wisteria-probe"), never part of the release jar.
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "wisteria-probe"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}

// ./gradlew runClientGameTest -Pbackend=VULKAN (or OPENGL) forces the graphics backend for a run.
loom.runs.configureEach {
	if (project.hasProperty('backend')) {
		programArgs '--graphicsBackend', project.property('backend').toString()
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from("LICENSE") {
		rename { "${it}_wisteria" }
	}
}
