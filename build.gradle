plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base {
	archivesName = 'wisteria'
}

repositories {
	mavenCentral()
}

// The readiness gate (tools/gate.sh): a dev-only mod with client game tests, never part of the release jar.
fabricApi {
	configureTests {
		createSourceSet = true
		modId = 'wisteria-gate'
		enableGameTests = false
		enableClientGameTests = true
		eula = true
		// The gate launches the game twice over the same directory to prove settings survive a restart;
		// tools/gate.sh wipes the directory itself before the first launch.
		clearRunDirectory = false
	}
}

loom {
	mods {
		"wisteria" {
			sourceSet sourceSets.main
		}
	}

	// -Pbackend=VULKAN (or OPENGL) forces the graphics backend for a run.
	runs.configureEach {
		if (project.hasProperty('backend')) {
			programArgs '--graphicsBackend', project.property('backend').toString()
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// SOCKS5 and HTTP CONNECT for the game's connection (Apache-2.0); the game ships the rest of Netty, not these two.
	include(implementation("io.netty:netty-handler-proxy:4.2.15.Final") { transitive = false })
	include(implementation("io.netty:netty-codec-socks:4.2.15.Final") { transitive = false })

	testImplementation platform('org.junit:junit-bom:5.13.4')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
	useJUnitPlatform()
}

// The gate's audit launch runs the client with Wisteria switched off (tools/gate.sh sets WISTERIA_DISABLED).
tasks.matching { it.name == 'runClientGameTest' }.configureEach {
	if (System.getenv('WISTERIA_DISABLED') != null) {
		jvmArgs '-Dwisteria.disabled=true'
	}
}

processResources {
	def version = project.version
	inputs.property "version", version
	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

processGametestResources {
	def version = project.version
	inputs.property "version", version
	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from("LICENSE") {
		rename { "${it}_wisteria" }
	}
}
