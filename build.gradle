// Root project: only shared conventions. See core/ and compat/v26_x/.
plugins {
	// Loaded once here so every subproject (core included, for its Loom companion) sees the same plugin classes.
	id 'net.fabricmc.fabric-loom' apply false
}

subprojects {
	group = rootProject.group
	version = rootProject.version

	repositories {
		mavenCentral()
	}

	tasks.withType(JavaCompile).configureEach {
		it.options.release = 25
		it.options.encoding = 'UTF-8'
	}
}
